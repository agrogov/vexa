# Default values for the Vexa Helm chart.
# This chart is designed for LOCAL development builds:
#   - imagePullPolicy defaults to IfNotPresent
#   - images default to DockerHub repos with :dev tag
#   - Override tags with specific YYMMDD-HHMM timestamps for traceability

global:
  imageTag: ""              # When set, overrides all service image tags
  imagePullPolicy: Always
  imagePullSecrets: []
  clusterDomain: cluster.local

  # Common pod-level knobs (override per component if you want)
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

# Shared secrets (recommended: override via --set-file or external secret tooling)
secrets:
  existingSecretName: ""
  adminApiToken: "CHANGE_ME"   # Used by Admin API auth & MeetingToken signing across services
  transcriptionServiceToken: ""
  internalApiSecret: ""        # Shared secret for gateway↔admin-api internal calls (defaults to "vexa-internal-secret")
  vexaApiKey: ""               # Pre-provisioned API key for dashboard proxy (optional, create via admin API)

# Shared database config (used by admin-api, meeting-api, runtime-api)
database:
  host: ""          # auto-filled if postgres.enabled=true, else REQUIRED
  port: 5432
  name: "vexa"
  user: "postgres"
  password: "postgres"
  sslMode: "disable"

# Shared redis config
redisConfig:
  url: ""           # auto-filled if redis.enabled=true, else REQUIRED
  host: ""
  port: 6379

# ---------- Components ----------

apiGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: vexaai/api-gateway
    tag: dev
  mcpUrl: ""
  agentApiUrl: ""
  rateLimitRpm: ""
  corsOrigins: ""
  logLevel: "INFO"
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraEnv: []
  extraSecretName: ""
  extraSecretEnv: {}

adminApi:
  enabled: true
  replicaCount: 2
  image:
    repository: vexaai/admin-api
    tag: dev
  service:
    type: ClusterIP
    port: 8001
  logLevel: "INFO"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraEnv:
    - name: DB_POOL_SIZE
      value: "10"
    - name: DB_MAX_OVERFLOW
      value: "5"
    - name: DB_POOL_TIMEOUT
      value: "10"
  extraSecretName: ""
  extraSecretEnv: {}

meetingApi:
  enabled: true
  replicaCount: 2
  image:
    repository: vexaai/meeting-api
    tag: dev
  bot:
    image: "vexaai/vexa-bot:latest"
    nodeSelector: ""            # JSON string, e.g. '{"k8s.infobip.com/nodepool":"worker"}'
    imagePullSecrets: []        # Override global.imagePullSecrets for bot pods
    resources: {}               # cpu/memory requests+limits for bot pods
  service:
    type: ClusterIP
    port: 8080
  recordingEnabled: "true"
  storageBackend: minio
  captureModes: ""              # e.g. "audio" or "audio,video"
  transcriptionServiceUrl: ""
  transcriptionServiceToken: ""
  transcriptionGatewayUrl: ""
  runtimeApiToken: ""
  postMeetingHooks: ""          # e.g. "http://agent-api:8100/internal/webhooks/meeting-completed"
  extraSecretName: ""           # Secret name for env vars pulled from a secret
  extraSecretEnv: {}            # Map of ENV_VAR_NAME: secret-key, e.g. OPENAI_API_KEY: "AZURE_OPENAI_API_KEY"
  minioSecure: "false"
  logLevel: "INFO"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  extraEnv:
    - name: DB_POOL_SIZE
      value: "20"
    - name: DB_MAX_OVERFLOW
      value: "20"
    - name: DB_POOL_TIMEOUT
      value: "10"

runtimeApi:
  enabled: true
  replicaCount: 2
  orchestrator: "process"       # "process" (default), "kubernetes" (K8s pods), or "docker"
  agentImage: ""                # Agent container image (for vexa-agent pods)
  apiKeys: ""                   # API_KEYS / BOT_API_TOKEN for authenticating runtime-api
  browser:
    image: ""                   # Browser (bot) container image; defaults to meetingApi image if empty
    nodeSelector: ""            # JSON string, e.g. '{"k8s.infobip.com/nodepool":"worker"}'
    imagePullSecrets: []        # Override global.imagePullSecrets for browser (bot) pods
    resources: {}               # cpu/memory requests+limits for browser (bot) pods
  image:
    repository: vexaai/runtime-api
    tag: dev
  service:
    type: ClusterIP
    port: 8090
  profilesPath: "/app/profiles.yaml"
  logLevel: "INFO"
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  extraEnv:
    - name: DB_POOL_SIZE
      value: "10"
    - name: DB_MAX_OVERFLOW
      value: "5"
    - name: DB_POOL_TIMEOUT
      value: "10"
  extraSecretName: ""
  extraSecretEnv: {}

ttsService:
  enabled: true
  replicaCount: 1
  image:
    repository: vexaai/tts-service
    tag: dev
  service:
    type: ClusterIP
    port: 8002
  apiToken: ""
  config:
    piperVoicesDir: ""
    defaultVoices: ""
    outputSampleRate: ""
  auth:
    apiToken: ""
    existingSecretName: ""
    secretKey: ""
  logLevel: "INFO"
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  extraEnv: []

mcp:
  enabled: true
  replicaCount: 1
  image:
    repository: vexaai/mcp
    tag: dev
  service:
    type: ClusterIP
    port: 18888
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  extraEnv: []

agentApi:
  enabled: false
  replicaCount: 1
  image:
    repository: vexaai/agent-api
    tag: dev
  service:
    type: ClusterIP
    port: 8100
  orchestrator: "process"       # "process" (local docker) or "kubernetes"
  agent:
    image: ""                   # vexa-agent container image
    nodeSelector: ""            # JSON string, e.g. '{"k8s.infobip.com/nodepool":"worker"}'
    imagePullSecrets: []        # Override global.imagePullSecrets for agent pods
    resources: {}               # cpu/memory requests+limits for agent pods
  apiKey: ""                    # API_KEY / BOT_API_TOKEN for agent-api auth
  idleTimeout: ""               # Idle session timeout in seconds (default: 300)
  s3Endpoint: ""                # S3/MinIO endpoint when minio.enabled=false
  s3AccessKey: ""
  s3SecretKey: ""
  s3Bucket: "vexa"
  logLevel: "INFO"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  extraEnv: []

calendarService:
  enabled: false
  replicaCount: 1
  image:
    repository: vexaai/calendar-service
    tag: dev
  service:
    type: ClusterIP
    port: 8050
  logLevel: "INFO"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraEnv:
    - name: GOOGLE_CLIENT_ID
      value: ""
    - name: GOOGLE_CLIENT_SECRET
      value: ""
    - name: SYNC_INTERVAL_SECONDS
      value: "300"
    - name: DEFAULT_LEAD_TIME_MINUTES
      value: "2"
  extraSecretName: ""
  extraSecretEnv: {}

dashboard:
  enabled: false
  replicaCount: 2
  image:
    repository: vexaai/dashboard
    tag: dev
  service:
    type: ClusterIP
    port: 3000
  vexaApiUrl: ""
  vexaAdminApiUrl: ""
  agentApiUrl: ""
  # env:
  #   ENABLE_AZURE_AD_AUTH: "true"
  #   NEXTAUTH_URL: ""
  env: {}
  extraEnv: []
  extraSecretName: ""
  extraSecretEnv: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []

transcriptionService:
  enabled: false
  replicaCount: 1
  image:
    repository: vexaai/transcription-service
    tag: dev
  command: []
  args: []
  service:
    type: ClusterIP
    port: 8000
  azure:
    endpoint: ""
    apiVersion: ""
    apiKey: ""
  tolerations: []
  nodeSelector: {}
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  extraEnv: []

migrations:
  enabled: false
  backoffLimit: 3
  image:
    repository: ""
    tag: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ---------- Optional bundled dependencies (for dev) ----------

postgres:
  enabled: true
  image: postgres:17-alpine
  idleInTransactionTimeoutMs: 60000
  credentialsSecretName: postgres-credentials
  service:
    port: 5432
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 4Gi

redis:
  enabled: true
  image: redis:7-alpine
  durability:
    appendonly: "yes"
    appendfsync: "everysec"
    stopWritesOnBgsaveError: "no"
  maxmemory: "1gb"
  maxmemoryPolicy: "allkeys-lru"
  service:
    port: 6379
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

minio:
  enabled: true
  image:
    repository: minio/minio
    tag: latest
  existingSecretName: ""  # if set, reads MINIO_ROOT_USER/MINIO_ROOT_PASSWORD from this secret
  accessKey: vexa-access-key  # used only when existingSecretName is empty
  secretKey: vexa-secret-key  # used only when existingSecretName is empty
  bucket: vexa
  persistence:
    size: 10Gi
    storageClassName: ""
  service:
    type: ClusterIP
    port: 9000
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

# ---------- Ingress (optional; exposes api-gateway by default) ----------
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: "vexa.local"
  tls: []
  paths:
    - path: /
      pathType: Prefix
      service: api-gateway
      servicePort: 8000

# ---------- PgBouncer (optional connection pooler) ----------
pgbouncer:
  enabled: false
  image: edoburu/pgbouncer:latest
  replicaCount: 1
  poolMode: transaction
  defaultPoolSize: 20
  maxClientConn: 1000
  serverResetQuery: "DISCARD ALL"
  authType: scram-sha-256
  adminUsers: postgres
  service:
    port: 5432
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ---------- Recording / storage config ----------
recording:
  enabled: true
  storageBackend: "minio"
  minioSecure: false

# ---------- PodDisruptionBudgets (optional, off by default) ----------
podDisruptionBudgets: {}
  # api-gateway:
  #   enabled: false
  #   minAvailable: 1
  # admin-api:
  #   enabled: false
  #   minAvailable: 1
  # meeting-api:
  #   enabled: false
  #   minAvailable: 1
