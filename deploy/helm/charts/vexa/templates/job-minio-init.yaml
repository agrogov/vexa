{{- if .Values.minio.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vexa.componentName" (list . "minio-init") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "vexa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio-init
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minio-init
          image: docker.ib-ci.com/minio/mc:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              MINIO_HOST="http://{{ include "vexa.componentName" (list . "minio") }}:{{ .Values.minio.service.port }}"
              echo "Waiting for MinIO at $MINIO_HOST (up to 120s)..."
              for attempt in $(seq 1 24); do
                if mc alias set vexa "$MINIO_HOST" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>/dev/null && \
                   mc admin info vexa >/dev/null 2>&1; then
                  echo "MinIO ready after $((attempt * 5))s"
                  break
                fi
                echo "MinIO not ready yet (attempt $attempt/24), sleeping 5s..."
                sleep 5
              done
              mc admin info vexa
              mc mb --ignore-existing vexa/{{ .Values.minio.bucket }}
              echo "Bucket {{ .Values.minio.bucket }} ensured"
          env:
            - name: MINIO_ROOT_USER
              {{- if .Values.minio.existingSecretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.existingSecretName | quote }}
                  key: MINIO_ROOT_USER
              {{- else }}
              value: {{ .Values.minio.accessKey | quote }}
              {{- end }}
            - name: MINIO_ROOT_PASSWORD
              {{- if .Values.minio.existingSecretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.existingSecretName | quote }}
                  key: MINIO_ROOT_PASSWORD
              {{- else }}
              value: {{ .Values.minio.secretKey | quote }}
              {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
