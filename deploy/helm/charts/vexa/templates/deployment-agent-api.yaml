{{- if .Values.agentApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vexa.componentName" (list . "agent-api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agentApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "vexa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-api
  template:
    metadata:
      labels:
        {{- include "vexa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent-api
      annotations:
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq (default "process" .Values.agentApi.orchestrator) "kubernetes" }}
      serviceAccountName: {{ include "vexa.componentName" (list . "agent-api") }}
      {{- end }}
      containers:
        - name: agent-api
          securityContext:
            {{- toYaml .Values.global.securityContext | nindent 12 }}
          image: "{{ .Values.agentApi.image.repository }}:{{ .Values.global.imageTag | default .Values.agentApi.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.agentApi.service.port }}
          env:
            - name: ORCHESTRATOR_BACKEND
              value: {{ .Values.agentApi.orchestrator | default "process" | quote }}
            {{- if eq (.Values.agentApi.orchestrator | default "process") "kubernetes" }}
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_SERVICE_ACCOUNT
              value: {{ include "vexa.componentName" (list . "agent-api") | quote }}
            {{- end }}
            - name: REDIS_URL
              value: {{ include "vexa.redisUrl" . | quote }}
            - name: RUNTIME_API_URL
              value: "http://{{ include "vexa.componentName" (list . "runtime-api") }}:{{ .Values.runtimeApi.service.port }}"
            - name: ADMIN_API_URL
              value: "http://{{ include "vexa.componentName" (list . "admin-api") }}:{{ .Values.adminApi.service.port }}"
            - name: MEETING_API_URL
              value: "http://{{ include "vexa.componentName" (list . "meeting-api") }}:{{ .Values.meetingApi.service.port }}"
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: ADMIN_API_TOKEN
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: INTERNAL_API_SECRET
            - name: AGENT_API_INTERNAL_URL
              value: "http://{{ include "vexa.componentName" (list . "agent-api") }}.{{ .Release.Namespace }}.svc.{{ .Values.global.clusterDomain }}:{{ .Values.agentApi.service.port }}"
            {{- with .Values.agentApi.agent.image }}
            - name: AGENT_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- $agentPullSecrets := default .Values.global.imagePullSecrets .Values.agentApi.agent.imagePullSecrets }}
            {{- if $agentPullSecrets }}
            - name: AGENT_IMAGE_PULL_SECRETS
              value: {{ $agentPullSecrets | toJson | quote }}
            {{- end }}
            {{- if .Values.agentApi.agent.nodeSelector }}
            - name: AGENT_NODE_SELECTOR
              value: {{ .Values.agentApi.agent.nodeSelector | quote }}
            {{- end }}
            {{- with .Values.agentApi.agent.resources }}
            - name: AGENT_CPU_REQUEST
              value: {{ .requests.cpu | quote }}
            - name: AGENT_MEMORY_REQUEST
              value: {{ .requests.memory | quote }}
            - name: AGENT_CPU_LIMIT
              value: {{ .limits.cpu | quote }}
            - name: AGENT_MEMORY_LIMIT
              value: {{ .limits.memory | quote }}
            {{- end }}
            {{- if .Values.minio.enabled }}
            - name: STORAGE_BACKEND
              value: "s3"
            - name: S3_ENDPOINT
              value: "http://{{ include "vexa.componentName" (list . "minio") }}:{{ .Values.minio.service.port }}"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.minioSecretName" . }}
                  key: MINIO_ROOT_USER
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.minioSecretName" . }}
                  key: MINIO_ROOT_PASSWORD
            - name: S3_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            {{- else if .Values.agentApi.s3Endpoint }}
            - name: STORAGE_BACKEND
              value: "s3"
            - name: S3_ENDPOINT
              value: {{ .Values.agentApi.s3Endpoint | quote }}
            - name: S3_ACCESS_KEY
              value: {{ .Values.agentApi.s3AccessKey | default "" | quote }}
            - name: S3_SECRET_KEY
              value: {{ .Values.agentApi.s3SecretKey | default "" | quote }}
            - name: S3_BUCKET
              value: {{ .Values.agentApi.s3Bucket | default "vexa" | quote }}
            {{- end }}
            {{- with .Values.agentApi.idleTimeout }}
            - name: IDLE_TIMEOUT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agentApi.apiKey }}
            - name: API_KEY
              value: {{ . | quote }}
            - name: BOT_API_TOKEN
              value: {{ . | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.agentApi.logLevel | default "INFO" | quote }}
            {{- with .Values.agentApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if and .Values.agentApi.extraSecretName .Values.agentApi.extraSecretEnv }}
            {{- range $name, $key := .Values.agentApi.extraSecretEnv }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.agentApi.extraSecretName | quote }}
                  key: {{ $key | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.agentApi.resources | nindent 12 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
