{{- if .Values.runtimeApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vexa.componentName" (list . "runtime-api") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.runtimeApi.replicaCount }}
  {{- include "vexa.deploymentStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "vexa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runtime-api
  template:
    metadata:
      labels:
        {{- include "vexa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runtime-api
      annotations:
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq (default "process" .Values.runtimeApi.orchestrator) "kubernetes" }}
      serviceAccountName: {{ include "vexa.componentName" (list . "runtime-api") }}
      {{- end }}
      containers:
        - name: runtime-api
          securityContext:
            {{- toYaml .Values.global.securityContext | nindent 12 }}
          image: "{{ .Values.runtimeApi.image.repository }}:{{ .Values.global.imageTag | default .Values.runtimeApi.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: REDIS_URL
              value: {{ include "vexa.redisUrl" . | quote }}
            - name: DB_HOST
              value: {{ include "vexa.dbHostEffective" . | quote }}
            - name: DB_PORT
              value: {{ include "vexa.dbPortEffective" . | quote }}
            - name: DB_NAME
              {{- if .Values.postgres.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecretName | quote }}
                  key: POSTGRES_DB
              {{- else }}
              value: {{ .Values.database.name | quote }}
              {{- end }}
            - name: DB_USER
              {{- if .Values.postgres.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecretName | quote }}
                  key: POSTGRES_USER
              {{- else }}
              value: {{ .Values.database.user | quote }}
              {{- end }}
            - name: DB_SSL_MODE
              value: {{ .Values.database.sslMode | quote }}
            - name: DB_PASSWORD
              {{- if .Values.postgres.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecretName | quote }}
                  key: POSTGRES_PASSWORD
              {{- else }}
              value: {{ .Values.database.password | quote }}
              {{- end }}
            {{- if .Values.minio.enabled }}
            - name: MINIO_ENDPOINT
              value: "{{ include "vexa.componentName" (list . "minio") }}:{{ .Values.minio.service.port }}"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.minioSecretName" . }}
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.minioSecretName" . }}
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            {{- else }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.runtimeApi.minioEndpoint | default "" | quote }}
            - name: MINIO_ACCESS_KEY
              value: {{ .Values.runtimeApi.minioAccessKey | default "" | quote }}
            - name: MINIO_SECRET_KEY
              value: {{ .Values.runtimeApi.minioSecretKey | default "" | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.runtimeApi.minioBucket | default "vexa" | quote }}
            {{- end }}
            - name: ORCHESTRATOR_BACKEND
              value: {{ .Values.runtimeApi.orchestrator | default "process" | quote }}
            - name: ALLOW_PRIVATE_CALLBACKS
              value: "true"
            - name: BROWSER_IMAGE
              value: {{ .Values.runtimeApi.browser.image | default (printf "%s:%s" .Values.meetingApi.image.repository .Values.meetingApi.image.tag) | quote }}
            {{- with (default .Values.runtimeApi.agentImage .Values.agentApi.agent.image) }}
            - name: AGENT_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.runtimeApi.apiKeys }}
            - name: API_KEYS
              value: {{ .Values.runtimeApi.apiKeys | quote }}
            - name: BOT_API_TOKEN
              value: {{ .Values.runtimeApi.apiKeys | quote }}
            {{- end }}
            {{- if eq (default "process" .Values.runtimeApi.orchestrator) "kubernetes" }}
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_SERVICE_ACCOUNT
              value: {{ include "vexa.componentName" (list . "runtime-api") | quote }}
            - name: K8S_IMAGE_PULL_POLICY
              value: {{ .Values.global.imagePullPolicy | quote }}
            {{- $pullSecrets := default .Values.global.imagePullSecrets .Values.runtimeApi.browser.imagePullSecrets }}
            {{- if $pullSecrets }}
            - name: K8S_IMAGE_PULL_SECRETS
              value: {{ $pullSecrets | toJson | quote }}
            {{- end }}
            {{- if .Values.runtimeApi.browser.nodeSelector }}
            - name: K8S_NODE_SELECTOR
              value: {{ .Values.runtimeApi.browser.nodeSelector | quote }}
            {{- end }}
            {{- with .Values.runtimeApi.browser.resources }}
            - name: K8S_BOT_CPU_REQUEST
              value: {{ .requests.cpu | quote }}
            - name: K8S_BOT_MEMORY_REQUEST
              value: {{ .requests.memory | quote }}
            - name: K8S_BOT_CPU_LIMIT
              value: {{ .limits.cpu | quote }}
            - name: K8S_BOT_MEMORY_LIMIT
              value: {{ .limits.memory | quote }}
            {{- end }}
            {{- end }}
            - name: TRANSCRIPTION_SERVICE_URL
              value: {{ default (printf "http://%s.%s.svc.%s:%d/v1/audio/transcriptions" (include "vexa.componentName" (list . "transcription-service")) .Release.Namespace .Values.global.clusterDomain (.Values.transcriptionService.service.port | int)) .Values.meetingApi.transcriptionServiceUrl | quote }}
            - name: TRANSCRIPTION_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: TRANSCRIBER_API_KEY
            - name: MEETING_API_URL
              value: "http://{{ include "vexa.componentName" (list . "meeting-api") }}:{{ .Values.meetingApi.service.port | default 8080 }}"
            - name: RECORDING_ENABLED
              value: {{ .Values.recording.enabled | default true | quote }}
            - name: STORAGE_BACKEND
              value: {{ .Values.recording.storageBackend | default "minio" | quote }}
            - name: MINIO_SECURE
              value: {{ .Values.recording.minioSecure | default false | quote }}
            - name: PROFILES_PATH
              value: {{ .Values.runtimeApi.profilesPath | default "/app/profiles.yaml" | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.runtimeApi.logLevel | default "INFO" | quote }}
            {{- with .Values.runtimeApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if and .Values.runtimeApi.extraSecretName .Values.runtimeApi.extraSecretEnv }}
            {{- range $name, $key := .Values.runtimeApi.extraSecretEnv }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.runtimeApi.extraSecretName | quote }}
                  key: {{ $key | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: profiles
              mountPath: /app/profiles.yaml
              subPath: profiles.yaml
          resources:
            {{- toYaml .Values.runtimeApi.resources | nindent 12 }}
      volumes:
        - name: profiles
          configMap:
            name: {{ include "vexa.componentName" (list . "runtime-api-profiles") }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
